name: Stable Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "pyproject.toml"
      - "src/bo3wd/__init__.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Must match pyproject.toml and __version__, e.g. 2.0.4"
        required: true
        type: string
        default: "2.0.5"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, test, package and publish stable version
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $declaredVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $appSource = Get-Content -LiteralPath "src/bo3wd/__init__.py" -Raw
          $appVersionMatch = [regex]::Match($appSource, '__version__\s*=\s*"([^"]+)"')
          if (-not $appVersionMatch.Success) {
            throw "Could not parse __version__ from src/bo3wd/__init__.py"
          }
          $appVersion = $appVersionMatch.Groups[1].Value
          if ($appVersion -ne $declaredVersion) {
            throw "Version mismatch: pyproject.toml declares $declaredVersion but src/bo3wd/__init__.py declares $appVersion."
          }
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = "v$env:REQUESTED_VERSION"
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$declaredVersion"
          }
          if ($tag -ne "v$declaredVersion") {
            throw "Refusing release: requested tag $tag does not match pyproject.toml version v$declaredVersion. Bump the package version before publishing."
          }
          if ($declaredVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Package version must be a stable MAJOR.MINOR.PATCH version; got $declaredVersion"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$declaredVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Avoid republishing an existing version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existingTags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query GitHub Releases; refusing to publish without checking for a duplicate version."
          }
          if ($existingTags -contains "$env:RELEASE_TAG") {
            "SKIP_RELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Stable release $env:RELEASE_TAG already exists; version will not be overwritten."
          } else {
            "SKIP_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install project, tests and packager
        if: env.SKIP_RELEASE != 'true'
        run: python -m pip install -e ".[dev,build]"

      - name: Compile
        if: env.SKIP_RELEASE != 'true'
        run: python -m compileall -q src tests scripts

      - name: Lint
        if: env.SKIP_RELEASE != 'true'
        run: ruff check src tests scripts

      - name: Run full test suite
        if: env.SKIP_RELEASE != 'true'
        run: python -m pytest -q

      - name: Build standalone Windows application
        if: env.SKIP_RELEASE != 'true'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BO3WorkshopDownloader --paths src scripts\launcher.py

      - name: Create SHA-256 manifest
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\BO3WorkshopDownloader.exe").Hash.ToLowerInvariant()
          "$hash  BO3WorkshopDownloader.exe" | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Publish stable GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "dist\BO3WorkshopDownloader.exe" "dist\SHA256SUMS.txt" --title "BO3 Workshop Downloader v$env:RELEASE_VERSION" --generate-notes --latest --target "${{ github.sha }}"
