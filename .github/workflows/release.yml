name: Stable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Must match the version in pyproject.toml, e.g. 2.0.3"
        required: true
        type: string
        default: "2.0.3"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, test, package and publish stable version
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release version
        shell: pwsh
        run: |
          $declaredVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = "v${{ inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -ne "v$declaredVersion") {
            throw "Refusing release: requested tag $tag does not match pyproject.toml version v$declaredVersion. Bump the package version before publishing."
          }
          if ($declaredVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Package version must be a stable MAJOR.MINOR.PATCH version; got $declaredVersion"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$declaredVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install project, tests and packager
        run: python -m pip install -e ".[dev,build]"

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Lint
        run: ruff check src tests scripts

      - name: Run full test suite
        run: python -m pytest -q

      - name: Build standalone Windows application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BO3WorkshopDownloader --paths src scripts\launcher.py

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\BO3WorkshopDownloader.exe").Hash.ToLowerInvariant()
          "$hash  BO3WorkshopDownloader.exe" | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "dist\BO3WorkshopDownloader.exe" "dist\SHA256SUMS.txt" --title "BO3 Workshop Downloader v$env:RELEASE_VERSION" --generate-notes --latest --target "${{ github.sha }}"
