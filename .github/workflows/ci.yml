name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Compile all project and test modules
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Run tests
        run: python -m pytest -q --cov=bo3wd --cov-report=term-missing

  windows-executable:
    name: Build Windows GUI executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build,dev]"
      - name: Compile source
        run: python -m compileall -q src tests scripts
      - name: Run unit tests
        run: python -m pytest -q
      - name: Package GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BO3WorkshopDownloader --paths src scripts\launcher.py
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: BO3WorkshopDownloader-windows-x64
          path: dist/BO3WorkshopDownloader.exe
          if-no-files-found: error
